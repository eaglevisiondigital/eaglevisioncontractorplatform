name: Passport timeline preview
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: passport-timeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Install only the nine demonstrated missing fonts from signed Ubuntu
      # archives, then independently require every pinned browser dependency.
      - name: Install reviewed missing Chromium fonts from signed Ubuntu archives
        run: node scripts/cycle30-chromium-dependencies.mjs
      - name: Verify Chromium system dependencies without privileged changes
        run: npx playwright install-deps --dry-run chromium
      - run: npx playwright install chromium
      - run: npx playwright test --config tests/program/playwright.passport-timeline.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passport-timeline-synthetic-previews
          path: |
            artifacts/property/passport-timeline-*.png
            test-results/
          retention-days: 7
