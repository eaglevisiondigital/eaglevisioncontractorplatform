name: Passport timeline preview
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: passport-timeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The hosted image already supplies the Linux packages. Verify every pinned
      # dependency without refreshing unrelated third-party APT feeds. Missing
      # packages fail this step; no signature/TLS bypass or install fallback.
      - name: Verify Chromium system dependencies without privileged changes
        run: npx playwright install-deps --dry-run chromium
      - run: npx playwright install chromium
      - run: npx playwright test --config tests/program/playwright.passport-timeline.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passport-timeline-synthetic-previews
          path: |
            artifacts/property/passport-timeline-*.png
            test-results/
          retention-days: 7
