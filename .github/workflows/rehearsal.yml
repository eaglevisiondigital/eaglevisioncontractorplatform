name: Synthetic rehearsal compatibility
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-crypto48:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r recovery/monterey/rehearsal-requirements.lock
      - run: python -B scripts/package-rehearsal.py --check
      - run: >-
          python -c "import sys; sys.path.insert(0, 'recovery/monterey');
          from verify_package import check_dependencies; check_dependencies()"
      - run: python -B -m unittest discover -s recovery/monterey -p 'test_*.py'
      - run: npm ci
      - run: npx vitest run tests/property-p1-backup.test.ts tests/property-p1-mailbox.test.ts
        env:
          PROPEL_RECOVERY_PYTHON: python
