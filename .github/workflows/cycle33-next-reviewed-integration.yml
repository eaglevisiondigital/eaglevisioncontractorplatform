name: Cycle33 next reviewed custody integration
on:
  push:
    branches:
      [
        'codex/cycle33-next-reviewed-integration',
        'codex/cycle33-execution-closeout',
        'codex/cycle33-native-continuity-next',
        'codex/cycle33-v1-coordination-next',
      ]
  pull_request:
    branches:
      [
        'codex/cycle33-source-diagnostic-compatibility',
        'codex/cycle33-next-reviewed-integration',
        'codex/cycle33-execution-closeout',
        'codex/cycle33-execution-ci-compatibility',
        'codex/cycle33-native-continuity-next',
      ]
    paths:
      - '.github/workflows/cycle33-next-reviewed-integration.yml'
      - 'src/lib/workflows/maintenance-plan-correction.ts'
      - 'src/lib/workflows/offline-source-protocol.ts'
      - 'src/lib/workflows/task-receipt-reconciliation.ts'
      - 'src/lib/workflows/priority-saved-revisions.ts'
      - 'src/lib/workflows/service-source-review.ts'
      - 'src/lib/workflows/cost-coverage-path.ts'
      - 'src/lib/workflows/owner-action-verification.ts'
      - 'src/lib/workflows/task-correction-review.ts'
      - 'src/lib/workflows/published-service-navigation.ts'
      - 'src/lib/workflows/plan-cancellation-review.ts'
      - 'src/lib/workflows/addon-readiness-guide.ts'
      - 'tests/cycle33-v1-*.test.ts'
      - 'tests/cycle33-recorded-time-kind-review.test.ts'
      - 'tests/cycle33-published-history-filter-currentness.test.ts'
      - 'tests/cycle33-addon-job-filter-currentness.test.ts'
      - 'tests/cycle33-maintenance-review-reference-custody.test.ts'
      - 'tests/cycle33-task-display-reference-custody.test.ts'
      - 'scripts/check-cycle16-integrity.mjs'
      - 'scripts/check-cycle21.mjs'
      - 'tests/cycle33-owner-requirement-*.test.ts'
      - 'docs/program/CYCLE33_OWNER_REQUIREMENT_INPUT_CONTINUITY.md'
      - 'tests/cycle33-execution-*.test.ts'
      - 'tests/cycle33-owner-comparison-input-custody.test.ts'
      - 'tests/cycle33-service-lineage-handle-capture.test.ts'
      - 'scripts/cycle25-source-lineage.mjs'
      - 'tests/cycle33-next-*.test.ts'
      - 'tests/cycle33-maintenance-review-custody.test.ts'
permissions:
  contents: read
concurrency:
  group: next-reviewed-custody-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-native-and-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - name: Bind actual clean candidate and exact native authors
        run: |
          mkdir -p artifacts/cycle33/next-execution
          node --input-type=module <<'NODE'
          import{execFileSync}from'node:child_process';import{writeFileSync,readFileSync}from'node:fs';import{createHash}from'node:crypto';
          import{cycle33NextAuthors,cycle33NextParent,admitCycle33NextSource,cycle33ExecutionAuthors,cycle33ExecutionParent,admitCycle33ExecutionSource,admitCycle33ExecutionCiCompatibility,cycle33OwnerRequirementAuthor as owner,admitCycle33OwnerRequirementSource,cycle33V1Authors,cycle33V1Parent,admitCycle33V1Source,cycle25SourcePorts as p}from'./scripts/cycle25-source-lineage.mjs';
          const git=(...args)=>execFileSync('git',['--no-replace-objects',...args],{encoding:'utf8'}).trim();
          if(git('status','--porcelain','--untracked-files=all'))throw Error('Clean candidate required');
          const admitted=[...cycle33NextAuthors.map(s=>admitCycle33NextSource(s.modified[0],readFileSync(s.modified[0]),p.git(cycle33NextParent,s.modified[0]))),...cycle33ExecutionAuthors.map(s=>admitCycle33ExecutionSource(s.modified[0],readFileSync(s.modified[0]),p.git(cycle33ExecutionParent,s.modified[0])))];
          admitted.push(admitCycle33OwnerRequirementSource(owner.path,readFileSync(owner.path),p.git(owner.parent,owner.path)));
          const f=JSON.parse(readFileSync('docs/program/CYCLE22_SOURCE_MANIFEST.json')).independent_files.find(f=>f.path==='tests/cycle22-independent-integration-review.test.ts');admitted.push(admitCycle33ExecutionCiCompatibility(f,readFileSync(f.path)));
          admitted.push(...cycle33V1Authors.map(a=>admitCycle33V1Source(a.path,readFileSync(a.path),p.git(cycle33V1Parent,a.path))));
          const paths=[...cycle33V1Authors.flatMap(a=>[a.path,...a.added.map(f=>f.path),...a.original_companions.map(f=>f.path)]),'tests/cycle33-v1-source-admission.test.ts','tests/cycle33-v1-combined-authority.test.ts','scripts/check-cycle16-integrity.mjs','scripts/check-cycle21.mjs','docs/program/CYCLE33_V1_SCOPE_MATRIX.md','docs/program/CYCLE33_V1_COORDINATED_VALIDATION.md',owner.path,...owner.added.map(s=>s.path),'tests/cycle33-owner-requirement-source-lineage.test.ts','tests/program/cycle22-ci-delta-review.test.ts',...cycle33ExecutionAuthors.flatMap(s=>[...s.modified,...s.added]),'scripts/check-cycle19-integrity.mjs','scripts/check-cycle22.mjs','scripts/check-cycle23.mjs','scripts/check-cycle24.mjs',...cycle33NextAuthors.flatMap(s=>[...s.modified,...s.added]),'scripts/cycle25-source-lineage.mjs','vite.config.ts','playwright.config.ts','package.json','package-lock.json','.github/workflows/cycle33-next-reviewed-integration.yml','tests/cycle22-independent-integration-review.test.ts','tests/cycle33-execution-ci-compatibility.test.ts','.github/workflows/cycle19-integration.yml'];
          writeFileSync('artifacts/cycle33/next-execution/binding.json',JSON.stringify({source:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),admitted,hashes:Object.fromEntries(paths.map(path=>[path,createHash('sha256').update(readFileSync(path)).digest('hex')]))},null,2)+'\n');
          NODE
      - run: npm run typecheck
      - run: npm run features:check
      - run: npm run format:check
      - run: node scripts/check-cycle24.mjs
      - name: New V1 native regressions and independent combined source authority
        run: >-
          npx vitest run
          tests/cycle33-recorded-time-kind-review.test.ts
          tests/cycle33-published-history-filter-currentness.test.ts
          tests/cycle33-addon-job-filter-currentness.test.ts
          tests/cycle33-maintenance-review-reference-custody.test.ts
          tests/cycle33-task-display-reference-custody.test.ts
          tests/cycle33-v1-combined-authority.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/v1-native.json
      - name: Require exact93 V1 native and independently authored combined cases
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/v1-native.json'));
          const expected=new Map(Object.entries({'tests/cycle33-recorded-time-kind-review.test.ts':14,'tests/cycle33-published-history-filter-currentness.test.ts':17,'tests/cycle33-addon-job-filter-currentness.test.ts':17,'tests/cycle33-maintenance-review-reference-custody.test.ts':21,'tests/cycle33-task-display-reference-custody.test.ts':21,'tests/cycle33-v1-combined-authority.test.ts':3}));
          if(r.success!==true||r.numTotalTests!==93||r.numPassedTests!==93||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||r.numFailedTestSuites!==0||r.numPendingTestSuites!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==6)throw Error('Exact93 V1 current-source cases required');
          for(const s of r.testResults){const path=relative(process.cwd(),s.name).replaceAll('\\','/'),n=expected.get(path),a=s.assertionResults;if(!expected.delete(path)||s.status!=='passed'||a.length!==n||new Set(a.map(t=>t.fullName)).size!==n||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Incomplete V1 native suite');}if(expected.size)throw Error('Missing V1 native suite');
          NODE
      - name: New finite V1 source admission and unchanged legacy denial regressions
        run: >-
          npx vitest run tests/cycle33-v1-source-admission.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/v1-source.json
      - name: Require exact V1 source admission collection
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/v1-source.json')),s=r.testResults?.[0],a=s?.assertionResults;
          const n=109;
          if(r.success!==true||r.numTotalTests!==n||r.numPassedTests!==n||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||r.numFailedTestSuites!==0||r.numPendingTestSuites!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==1||relative(process.cwd(),s.name).replaceAll('\\','/')!=='tests/cycle33-v1-source-admission.test.ts'||s.status!=='passed'||a.length!==n||new Set(a.map(t=>t.fullName)).size!==n||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Exact finite V1 admission cases required');
          NODE
      - name: New owner requirement capture regressions and original owner requirements
        run: >-
          npx vitest run
          tests/cycle33-owner-requirement-input-continuity.test.ts
          tests/cycle24-owner-action-verification.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/owner-requirements.json
      - name: Require exact47 current-authority cases without skips or runtime errors
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/owner-requirements.json'));
          const expected=new Map(Object.entries({'tests/cycle33-owner-requirement-input-continuity.test.ts':20,'tests/cycle24-owner-action-verification.test.ts':27}));
          if(r.success!==true||r.numTotalTests!==47||r.numPassedTests!==47||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||r.numFailedTestSuites!==0||r.numPendingTestSuites!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==2)throw Error('Exact47 owner requirement cases required');
          for(const s of r.testResults){const path=relative(process.cwd(),s.name).replaceAll('\\','/'),n=expected.get(path),a=s.assertionResults;if(!expected.delete(path)||s.status!=='passed'||a.length!==n||new Set(a.map(t=>t.fullName)).size!==n||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Incomplete owner requirement suite');}if(expected.size)throw Error('Missing owner requirement suite');
          NODE
      - name: Finite owner requirement source admission and original denials
        run: >-
          npx vitest run tests/cycle33-owner-requirement-source-lineage.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/owner-source-lineage.json
      - name: Require exact33 finite-admission cases without skips or runtime errors
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/owner-source-lineage.json')),s=r.testResults?.[0],a=s?.assertionResults;
          if(r.success!==true||r.numTotalTests!==33||r.numPassedTests!==33||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||r.numFailedTestSuites!==0||r.numPendingTestSuites!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==1||relative(process.cwd(),s.name).replaceAll('\\','/')!=='tests/cycle33-owner-requirement-source-lineage.test.ts'||s.status!=='passed'||a.length!==33||new Set(a.map(t=>t.fullName)).size!==33||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Exact33 owner source-admission cases required');
          NODE
      - name: Retained83 original-engine custody and source regressions, explicitly single-worker
        run: >-
          npx vitest run
          tests/cycle33-maintenance-review-custody.test.ts
          tests/cycle33-next-offline-protocol-admission.test.ts
          tests/cycle33-next-source-lineage.test.ts
          tests/cycle33-next-combined-custody.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/application.json
      - name: Require all83 cases without skips or runtime errors
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/application.json'));
          const expected=new Map(Object.entries({'tests/cycle33-maintenance-review-custody.test.ts':30,'tests/cycle33-next-offline-protocol-admission.test.ts':26,'tests/cycle33-next-source-lineage.test.ts':24,'tests/cycle33-next-combined-custody.test.ts':3}));
          if(r.success!==true||r.numTotalTests!==83||r.numPassedTests!==83||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==4)throw Error('Exact83 passing new cases required');
          for(const s of r.testResults){const path=relative(process.cwd(),s.name).replaceAll('\\','/'),n=expected.get(path),a=s.assertionResults;if(!expected.delete(path)||s.status!=='passed'||a.length!==n||new Set(a.map(t=>t.fullName)).size!==n||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Incomplete new custody suite');}if(expected.size)throw Error('Missing new suite');
          NODE
      - name: New142 continuation regressions, original budgets and zero retries
        run: >-
          npx vitest run
          tests/cycle33-execution-task-continuity.test.ts
          tests/cycle33-owner-comparison-input-custody.test.ts
          tests/cycle33-service-lineage-handle-capture.test.ts
          tests/cycle33-execution-cost-selection.test.ts
          tests/cycle33-execution-source-admission.test.ts
          tests/cycle33-execution-integrated-authority.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/continuation.json
      - name: Finite test-only compatibility regressions, zero retries
        run: >-
          npx vitest run tests/cycle33-execution-ci-compatibility.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/ci-compatibility.json
      - name: Require all25 finite-admission cases without skips or runtime errors
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/ci-compatibility.json')),s=r.testResults?.[0],a=s?.assertionResults;
          if(r.success!==true||r.numTotalTests!==25||r.numPassedTests!==25||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||r.numFailedTestSuites!==0||r.numPendingTestSuites!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==1||relative(process.cwd(),s.name).replaceAll('\\','/')!=='tests/cycle33-execution-ci-compatibility.test.ts'||s.status!=='passed'||a.length!==25||new Set(a.map(t=>t.fullName)).size!==25||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Exact25 finite-admission cases required');
          NODE
      - name: Original128 source-validator regressions for changed build-only consumers
        run: >-
          npx vitest run tests/cycle22-validation.test.ts
          tests/cycle23-validation.test.ts tests/cycle24-validation.test.ts
          --maxWorkers=1 --retry=0 --reporter=json
          --outputFile=artifacts/cycle33/next-execution/legacy-validation.json
      - name: Require exact continuation and retained legacy collections
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';import{relative}from'node:path';
          for(const [file,counts]of Object.entries({
            'continuation.json':{'tests/cycle33-execution-task-continuity.test.ts':28,'tests/cycle33-owner-comparison-input-custody.test.ts':19,'tests/cycle33-service-lineage-handle-capture.test.ts':19,'tests/cycle33-execution-cost-selection.test.ts':22,'tests/cycle33-execution-source-admission.test.ts':51,'tests/cycle33-execution-integrated-authority.test.ts':3},
            'legacy-validation.json':{'tests/cycle22-validation.test.ts':58,'tests/cycle23-validation.test.ts':47,'tests/cycle24-validation.test.ts':23}
          })){
            const r=JSON.parse(readFileSync('artifacts/cycle33/next-execution/'+file)),expected=new Map(Object.entries(counts)),total=Object.values(counts).reduce((n,v)=>n+v,0);
            if(r.success!==true||r.numTotalTests!==total||r.numPassedTests!==total||r.numFailedTests!==0||r.numPendingTests!==0||r.numTodoTests!==0||(r.numRuntimeErrorTestSuites??0)!==0||r.testResults.length!==expected.size)throw Error('Incomplete continuation collection');
            for(const suite of r.testResults){const path=relative(process.cwd(),suite.name).replaceAll('\\','/'),n=expected.get(path),a=suite.assertionResults;if(!expected.delete(path)||suite.status!=='passed'||a.length!==n||new Set(a.map(t=>t.fullName)).size!==n||a.some(t=>t.status!=='passed'||!t.fullName||t.failureMessages.length))throw Error('Incomplete continuation suite');}if(expected.size)throw Error('Missing continuation suite');
          }
          NODE
      - run: npm run build
      - name: Observe the actual runner without expanding signed package trust
        run: node scripts/cycle32-runner-mirror-probe.mjs > artifacts/cycle33/next-execution/runner-mirror.json
      - run: node scripts/cycle30-chromium-dependencies.mjs
      - run: npx playwright install-deps --dry-run chromium
      - run: npx playwright install chromium
      - name: Original native three-brand desktop/tablet/mobile journeys
        run: npx playwright test -c tests/program/playwright.cycle28.config.ts --trace=retain-on-failure
      - name: Original production-OFF cases
        run: CYCLE28_BROWSER_MODE=off npx playwright test -c tests/program/playwright.cycle28.config.ts
      - name: Original strict browser/source/accessibility evidence collector
        run: CYCLE24_ARTIFACT_DIR=artifacts/cycle28 node scripts/collect-cycle32-browser.mjs
      - name: Final unchanged actual source evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import{execFileSync}from'node:child_process';import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';
          const git=(...args)=>execFileSync('git',['--no-replace-objects',...args],{encoding:'utf8'}).trim();
          const before=JSON.parse(readFileSync('artifacts/cycle33/next-execution/binding.json'));
