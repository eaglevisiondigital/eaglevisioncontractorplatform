name: Exact CI integration successor preserved-evidence verification
on:
  push:
    branches: ['codex/cycle33-v1-ci-integration-successor']
  pull_request:
    branches: ['codex/cycle33-c17-history-precondition']
    paths:
      - '.github/workflows/cycle33-v1-essential-followup.yml'
      - '.github/workflows/cycle33-ci-integration-successor.yml'
      - 'docs/program/CYCLE33_CI_INTEGRATION_SUCCESSOR.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: exact-ci-successor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-preserved-source-and-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Download only three exact previously reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/cycle33/ci-successor
          gh api repos/eaglevisiondigital/eaglevisioncontractorplatform/actions/artifacts/13546114381/zip > /tmp/ci-successor-new.zip
          gh api repos/eaglevisiondigital/eaglevisioncontractorplatform/actions/artifacts/13548340464/zip > /tmp/ci-successor-retained.zip
          gh api repos/eaglevisiondigital/eaglevisioncontractorplatform/actions/artifacts/13549912636/zip > /tmp/ci-successor-c17.zip
          echo '05a9f9da336f87bf38e2dc200709862ab0163c12bf05c84cc0e4051bae2b6ada  /tmp/ci-successor-new.zip' | sha256sum --check
          echo 'dbf9156373928dd94437fae88e7cdf70744ba8043c55f2cc2c7ac3270f1a366f  /tmp/ci-successor-retained.zip' | sha256sum --check
          echo '34d4e5670b82b6d519cc4bafdfcb5b8a67452d21de10a485047ba834a0c42114  /tmp/ci-successor-c17.zip' | sha256sum --check
          gh api repos/eaglevisiondigital/eaglevisioncontractorplatform/git/commits/a045e766d06ed02e4ca9349c46771aaca4dcd494 > artifacts/cycle33/ci-successor/c17-carrier.json
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for name in ('new','retained','c17'):
              target=Path('artifacts/cycle33/ci-successor')/name
              target.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile('/tmp/ci-successor-'+name+'.zip') as z:
                  names=set()
                  for item in z.infolist():
                      p=Path(item.filename)
                      if p.is_absolute() or '..' in p.parts or item.filename in names or (item.external_attr >> 16) & 0o170000 == 0o120000:
                          raise SystemExit('Unsafe or duplicate artifact entry')
                      names.add(item.filename)
                  z.extractall(target)
