name: Cycle 32 native continuity and source reliability
on:
  push:
    branches: ['codex/program-cycle-thirty-two-integration']
  pull_request:
    branches: ['codex/program-cycle-thirty-one-integration']
    paths:
      - 'src/components/workflows/*'
      - 'src/lib/workflows/*'
      - 'scripts/cycle25-source-lineage.mjs'
      - 'scripts/cycle32*'
      - 'src/lib/profit-guard.ts'
      - 'src/lib/program/voice-estimate.ts'
      - 'scripts/cycle30-chromium-dependencies.mjs'
      - 'scripts/check-cycle21.mjs'
      - 'scripts/check-cycle22.mjs'
      - 'scripts/check-cycle23.mjs'
      - 'scripts/collect-cycle24-browser.mjs'
      - 'tests/cycle32*'
      - 'docs/program/CYCLE32*'
      - '.github/workflows/cycle32-integration.yml'
permissions:
  contents: read
concurrency:
  group: cycle32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-combined-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run features:check
      - run: node --input-type=module -e "import {inspectCycle32Sources} from './scripts/cycle25-source-lineage.mjs'; console.log(inspectCycle32Sources({requireCombined:true}));"
      - run: node --input-type=module -e "import {inspectCycle32BusySources} from './scripts/cycle25-source-lineage.mjs'; console.log(inspectCycle32BusySources({requirePresent:true}));"
      - run: npx vitest run tests/cycle31*.test.ts tests/cycle30*.test.ts tests/cycle21-validation.test.ts tests/cycle22-validation.test.ts tests/cycle23-validation.test.ts tests/cycle29-source-lineage.test.ts tests/cycle28-source-lineage.test.ts tests/cycle27-source-lineage.test.ts tests/cycle26-source-review.test.ts tests/cycle25-source-lineage.test.ts tests/cycle25-combined-integration.test.ts tests/cycle28-contractor-journey.test.ts tests/cycle21-recorded-owner-actions.test.ts tests/cycle24-service-request-actions.test.ts tests/cycle24-plan-cancellation-review.test.ts --maxWorkers=1 --reporter=json --outputFile=artifacts/cycle31/application-results.json
      - name: Require every exact focused application case
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import{relative}from'node:path';
          const expected=new Map(Object.entries({'cycle31-owner-navigation-runtime.test.ts':15,'cycle31-chromium-source-shape.test.ts':20,'cycle31-independent-source-review.test.ts':10,'cycle31-maintenance-proposal-input.test.ts':11,'cycle31-owner-source-compatibility.test.ts':22,'cycle31-source-lineage.test.ts':28,'cycle21-validation.test.ts':46,'cycle22-validation.test.ts':58,'cycle23-validation.test.ts':47,'cycle21-recorded-owner-actions.test.ts':37,'cycle24-plan-cancellation-review.test.ts':43,'cycle24-service-request-actions.test.ts':58,'cycle25-combined-integration.test.ts':16,'cycle25-source-lineage.test.ts':26,'cycle26-source-review.test.ts':20,'cycle27-source-lineage.test.ts':20,'cycle28-contractor-journey.test.ts':9,'cycle28-source-lineage.test.ts':14,'cycle29-source-lineage.test.ts':15,'cycle30-browser-timing.test.ts':4,'cycle30-chromium-dependencies.test.ts':11,'cycle30-customer-source-audit.test.ts':15,'cycle30-independent-source-review.test.ts':10,'cycle30-maintenance-date.test.ts':8,'cycle30-owner-source-audit.test.ts':10,'cycle30-source-lineage.test.ts':15,'cycle30-task-custody-navigation.test.ts':3}).map(([p,n])=>['tests/'+p,n]));
          const r=JSON.parse(readFileSync('artifacts/cycle31/application-results.json'));
          if(!r.success||r.numTotalTests!==591||r.numPassedTests!==591||r.numFailedTests!==0||r.numPendingTests!==0||r.testResults.length!==27)throw Error('Exact591 passing cases and27 suites required');
          for(const s of r.testResults){const p=relative(process.cwd(),s.name),n=expected.get(p),a=s.assertionResults;if(!expected.delete(p)||s.status!=='passed'||a.length!==n||new Set(a.map(c=>c.fullName)).size!==n||a.some(c=>!c.fullName||c.status!=='passed'))throw Error('Incomplete or changed suite '+p);}if(expected.size)throw Error('Missing focused suites');
          NODE
      - run: npx vitest run tests/cycle32*.test.ts --maxWorkers=1 --reporter=json --outputFile=artifacts/cycle32/application-results.json
      - run: node scripts/cycle32-application-evidence.mjs artifacts/cycle32/application-results.json
      - run: npm run build
      - name: Observe same-runner reviewed Chromium dependency sources
        run: |
          mkdir -p artifacts/cycle32
          node scripts/cycle32-runner-mirror-probe.mjs > artifacts/cycle32/combined-runner-mirror.json
      - run: node scripts/cycle30-chromium-dependencies.mjs
      - run: npx playwright install-deps --dry-run chromium
      - run: npx playwright install chromium
      - run: npx playwright test -c tests/program/playwright.cycle28.config.ts
      - run: CYCLE28_BROWSER_MODE=off npx playwright test -c tests/program/playwright.cycle28.config.ts
      - run: CYCLE24_ARTIFACT_DIR=artifacts/cycle28 node scripts/collect-cycle32-browser.mjs
      - name: Verify pending owner privacy, keyboard focus and retained context
        run: npx playwright test -c tests/program/playwright.cycle32-owner-busy.config.ts
      - name: Require all eighteen new source-bound owner pending-state cases
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';
          const r=JSON.parse(readFileSync('artifacts/cycle32/owner-busy/browser-results.json'));
          if(r.config.workers!==1||r.stats.expected!==18||r.stats.unexpected!==0||r.stats.skipped!==0||r.stats.flaky!==0||!Array.isArray(r.errors)||r.errors.length!==0)throw Error('Exact18 passing cases without retries or skips required');
          const expected=new Set(['desktop','tablet','mobile'].flatMap(p=>[0,1,2].flatMap(b=>['pending privacy preserves disclosure/filter context, owned focus and hidden navigation','revocation across a genuine pending native promise withholds private facts and navigation'].map(title=>p+'\0brand '+b+': '+title))));
          function walk(suites){for(const s of suites){for(const spec of s.specs??[])for(const t of spec.tests??[]){const key=t.projectName+'\0'+spec.title;if(!expected.delete(key)||t.timeout!==30000||t.expectedStatus!=='passed'||t.status!=='expected'||t.results.length!==1||t.results[0].status!=='passed'||t.results[0].retry!==0)throw Error('Changed or incomplete pending-state case '+key);}walk(s.suites??[]);}}
          walk(r.suites);if(expected.size)throw Error('Missing pending-state cases');
          NODE
      - name: Require original owner navigation assertions under original budgets on current candidate
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/cycle32/owner-original-budget-results.json
          CYCLE30_TIMING_OUTPUT: artifacts/cycle32/owner-current-timing.json
        run: npx playwright test tests/browser/cycle21-canonical-corrections.spec.ts --grep 'canonical task cost plan corrections and exact history navigation / roofing-example' --project=desktop --project=tablet --workers=2 --retries=0 --reporter=json,./scripts/cycle30-browser-timing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle32-exact-combined-workflow-evidence
          path: |
            artifacts/cycle31/
            artifacts/cycle32/
            artifacts/cycle28/
            test-results/
          retention-days: 7
