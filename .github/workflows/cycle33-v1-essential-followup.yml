    branches:
      [
        'codex/cycle33-v1-revocation-ci-reviewed',
        'codex/cycle33-v1-essential-followup',
      ]
    paths: ['.github/workflows/cycle33-v1-essential-followup.yml']
permissions:
  contents: read
concurrency:
  group: v1-essential-followup-${{ github.ref }}
  cancel-in-progress: false
