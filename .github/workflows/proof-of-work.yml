name: Proof of Work documentation preview
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: proof-of-work-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/program/playwright.proof-of-work.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-of-work-synthetic-previews
          path: |
            artifacts/property/proof-of-work-*.png
            test-results/
          retention-days: 7
