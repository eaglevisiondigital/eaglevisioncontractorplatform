name: Fixed568 complete isolated unit supplement
# Explicit execution request only. Opening/updating this proposal does not run489files.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  application:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-fixed568-unit-supplement'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      UNIT_SHARD: ${{ matrix.shard }}
      DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}
      DIAGNOSTIC_EVENT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f0c6b53747e60765cdc7faf1308b57ce730676f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - run: npm ci
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r recovery/monterey/requirements.lock
      - name: Prepare output-only adapters outside the fixed checkout
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          cat > "$DIAGNOSTIC_DIR/source.mjs" <<'PROBE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync, readdirSync, writeFileSync, realpathSync } from 'node:fs';
          import { resolve } from 'node:path';
          const target = '3f0c6b53747e60765cdc7faf1308b57ce730676f';
          const tree = '00f6d211affd7e364573ca792e08a1dd67b8f190';
          const phase = process.argv[2];
          if (!['before', 'after'].includes(phase)) throw Error('Exact probe phase required');
          const output = process.env.DIAGNOSTIC_DIR;
          if (!output || !process.env.RUNNER_TEMP || !realpathSync(output).startsWith(realpathSync(process.env.RUNNER_TEMP) + '/') || realpathSync(output) === realpathSync(process.cwd()) || realpathSync(output).startsWith(realpathSync(process.cwd()) + '/')) throw Error('Outside-checkout runner temporary output required');
          const sha = (b) => createHash('sha256').update(b).digest('hex');
          const git = (...args) => execFileSync('/usr/bin/git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', '-c', 'credential.helper=', ...args], {
            maxBuffer: 128 * 1024 * 1024,
            env: { PATH: process.env.PATH, LANG: 'C', LC_ALL: 'C', GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_SYSTEM: '/dev/null', GIT_CONFIG_GLOBAL: '/dev/null', GIT_NO_LAZY_FETCH: '1', GIT_ALLOW_PROTOCOL: '', GIT_ATTR_NOSYSTEM: '1', GIT_TERMINAL_PROMPT: '0', GIT_OPTIONAL_LOCKS: '0' },
            stdio: ['pipe', 'pipe', 'pipe'],
          });
          const observedHead = git('rev-parse', 'HEAD').toString().trim();
          const observedTree = git('rev-parse', 'HEAD^{tree}').toString().trim();
          if (observedHead !== target || observedTree !== tree) throw Error('Exact fixed568 checkout required');
          const raw = git('ls-tree', '-rz', '--full-tree', tree);
          const rows = raw.toString().split('\0').filter(Boolean).map((line) => {
            const m = /^(100644|100755) blob ([a-f0-9]{40})\t(.+)$/.exec(line);
            if (!m || m[3].split('/').some((p) => !p || p === '.' || p === '..')) throw Error('Exact regular target inventory required');
            return { mode: m[1], blob: m[2], path: m[3] };
          });
          if (rows.length !== 2568) throw Error('Exact2568 target inventory required');
          const batch = execFileSync('/usr/bin/git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', '-c', 'credential.helper=', 'cat-file', '--batch'], {
            input: rows.map((row) => row.blob).join('\n') + '\n', maxBuffer: 128 * 1024 * 1024,
            env: { PATH: process.env.PATH, LANG: 'C', LC_ALL: 'C', GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_SYSTEM: '/dev/null', GIT_CONFIG_GLOBAL: '/dev/null', GIT_NO_LAZY_FETCH: '1', GIT_ALLOW_PROTOCOL: '', GIT_ATTR_NOSYSTEM: '1', GIT_TERMINAL_PROMPT: '0', GIT_OPTIONAL_LOCKS: '0' },
            stdio: ['pipe', 'pipe', 'pipe'],
          });
          let offset = 0;
          const mismatches = [], known = new Set(rows.map((row) => row.path)), directories = new Set();
          for (const row of rows) {
            const end = batch.indexOf(10, offset), header = batch.subarray(offset, end).toString();
            const parts = header.split(' ');
            if (end < 0 || parts[0] !== row.blob || parts[1] !== 'blob' || !/^\d+$/.test(parts[2])) throw Error('Exact object batch required');
            const size = Number(parts[2]), body = batch.subarray(end + 1, end + 1 + size);
            if (body.length !== size || batch[end + 1 + size] !== 10) throw Error('Complete object body required');
            offset = end + 2 + size;
            const segments = row.path.split('/');
            for (let i = 1; i < segments.length; i++) directories.add(segments.slice(0, i).join('/'));
            try {
              const stat = lstatSync(row.path);
              if (!stat.isFile() || stat.isSymbolicLink()) mismatches.push({ path: row.path, reason: 'type' });
              else {
                const mode = stat.mode & 0o7777, expectedMode = row.mode === '100755' ? 0o755 : 0o644;
                if (mode !== expectedMode) mismatches.push({ path: row.path, reason: 'mode', actual: mode.toString(8), expected: expectedMode.toString(8) });
                const actual = sha(readFileSync(row.path)), expected = sha(body);
                if (actual !== expected) mismatches.push({ path: row.path, reason: 'body', actual, expected });
              }
            } catch { mismatches.push({ path: row.path, reason: 'missing-or-unreadable' }); }
          }
          if (offset !== batch.length) throw Error('No trailing object data permitted');
          const extraPaths = [];
          // This narrower telemetry walk omits only the five output/dependency roots below.
          // It neither copies nor changes the canonical guard exclusion policy (which also omits playwright-report).
          const excluded = new Set(['.git', 'node_modules', 'dist', 'coverage', 'test-results']);
          function walk(directory = '') {
            for (const name of readdirSync(directory || '.').sort()) {
              if (!directory && excluded.has(name)) continue;
              const path = directory ? directory + '/' + name : name;
              const stat = lstatSync(path);
              if (stat.isDirectory()) { if (!directories.has(path)) extraPaths.push(path); walk(path); }
              else if (!known.has(path)) extraPaths.push(path);
            }
          }
          walk();
          const knownEmptyFixtureDirectories = phase === 'after' && process.env.UNIT_SHARD === '1' && extraPaths.length === 2 && extraPaths.every((path) => ['artifacts', 'artifacts/cycle27'].includes(path) && lstatSync(path).isDirectory()) && (!extraPaths.length || readdirSync('artifacts/cycle27').length === 0);
          const report = { classification: 'UNSIGNED_FIXED568_DIAGNOSTIC_NOT_ADMISSION', phase, target, targetTree: tree, workflowSourceSHA: process.env.DIAGNOSTIC_WORKFLOW_SHA, eventSHA: process.env.DIAGNOSTIC_EVENT_SHA, observedHead, observedTree, rows: rows.length, inventorySHA256: sha(raw), umask: process.umask().toString(8), mismatches, extraPaths, canonicalPhysicalAdmission: false, knownEmptyFixtureDirectories, pass: !mismatches.length && (!extraPaths.length || knownEmptyFixtureDirectories) };
          writeFileSync(resolve(output, 'source-' + phase + '.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify({ phase, rows: rows.length, mismatches: mismatches.length, extraPaths: extraPaths.length, pass: report.pass }));
          if (!report.pass) process.exitCode = 1;
          PROBE
          node --check "$DIAGNOSTIC_DIR/source.mjs"
          cat > "$DIAGNOSTIC_DIR/plan.mjs" <<'PROBE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,globSync,realpathSync} from 'node:fs';
          import {resolve,relative} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const root=process.cwd(),out=process.env.DIAGNOSTIC_DIR,index=Number(process.env.UNIT_SHARD);
          if(!out||!realpathSync(out).startsWith(realpathSync(process.env.RUNNER_TEMP)+'/')||realpathSync(out)===realpathSync(root)||realpathSync(out).startsWith(realpathSync(root)+'/')||!Number.isInteger(index)||index<1||index>8)throw Error('Exact outside-checkout shard required');
          const {applicationShards,binding,requireUnion}=await import(pathToFileURL(resolve('scripts/cycle33-foundation-evidence.mjs')).href);
          if(applicationShards!==8)throw Error('Original eight-shard planner required');
          const source=binding();
          if(source.source!=='3f0c6b53747e60765cdc7faf1308b57ce730676f'||source.tree!=='00f6d211affd7e364573ca792e08a1dd67b8f190')throw Error('Fixed568 source required');
          const raw=execFileSync(process.execPath,['node_modules/vitest/vitest.mjs','list','--filesOnly','--json'],{maxBuffer:32*1024*1024});
          const full=JSON.parse(raw).map(p=>relative(root,p.file).replaceAll('\\','/')).sort();
          requireUnion([full],globSync('tests/**/*.test.ts').sort());
          if(full.length!==489)throw Error('Exact489-file collection required');
          const {BaseSequencer}=await import(pathToFileURL(resolve('node_modules/vitest/dist/node.js')).href);
          const selected=(await new BaseSequencer({config:{root,shard:{index,count:8}}}).shard(full.map(file=>({moduleId:resolve(file)})))).map(p=>relative(root,p.moduleId).replaceAll('\\','/')).sort();
          writeFileSync(resolve(out,'plan.json'),JSON.stringify({kind:'application',index,count:8,binding:source,full,selected,workflowSourceSHA:process.env.DIAGNOSTIC_WORKFLOW_SHA,eventSHA:process.env.DIAGNOSTIC_EVENT_SHA},null,2));
          PROBE
          node --check "$DIAGNOSTIC_DIR/plan.mjs"
          cat > "$DIAGNOSTIC_DIR/reporter.mjs" <<'PROBE'
          import {writeFileSync,realpathSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const out=process.env.DIAGNOSTIC_DIR;
          if(!out||!realpathSync(out).startsWith(realpathSync(process.env.RUNNER_TEMP)+'/')||realpathSync(out)===realpathSync(process.cwd())||realpathSync(out).startsWith(realpathSync(process.cwd())+'/'))throw Error('Outside-checkout diagnostics required');
          const {default:OriginalReporter}=await import(pathToFileURL(resolve('scripts/cycle33-foundation-reporter.mjs')).href);
          // Reuse every original collection/result/budget rule. Override only output sink.
          export default class TemporaryReporter extends OriginalReporter {
            save(){writeFileSync(resolve(out,'observations.json'),JSON.stringify(this.data,null,2));}
          }
          PROBE
          node --check "$DIAGNOSTIC_DIR/reporter.mjs"
          cat > "$DIAGNOSTIC_DIR/validate.mjs" <<'PROBE'
          import {readFileSync,writeFileSync,readdirSync,realpathSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const out=process.env.DIAGNOSTIC_DIR;
          if(!out||!process.env.RUNNER_TEMP||!realpathSync(out).startsWith(realpathSync(process.env.RUNNER_TEMP)+'/')||realpathSync(out)===realpathSync(process.cwd())||realpathSync(out).startsWith(realpathSync(process.cwd())+'/'))throw Error('Outside-checkout validation output required');
          const {validateApplication,requireUnion,binding}=await import(pathToFileURL(resolve('scripts/cycle33-foundation-evidence.mjs')).href);
          const json=path=>JSON.parse(readFileSync(path));
          if(process.argv[2]==='shard'){
           const plan=json(resolve(out,'plan.json')),observed=json(resolve(out,'observations.json')),raw=json(resolve(out,'results.json'));
           const result=validateApplication(plan,observed,raw);
           writeFileSync(resolve(out,'verified.json'),JSON.stringify({...plan,...result,verdict:'EXACT_SHARD_COMPLETE',classification:'UNIT_SHARD_ONLY_NOT_FOUNDATION_OR_SOURCE_ADMISSION'},null,2));
          }else if(process.argv[2]==='combine'){
           const paths=readdirSync(resolve(out,'downloaded')).sort(),expected=Array.from({length:8},(_,i)=>'fixed568-unit-shard-'+(i+1));
           requireUnion([paths],expected);
           const reports=expected.map((p,i)=>{const directory=resolve(out,'downloaded',p),report=json(resolve(directory,'verified.json'));const plan=json(resolve(directory,'plan.json'));const actual=validateApplication(plan,json(resolve(directory,'observations.json')),json(resolve(directory,'results.json')));if(JSON.stringify(report)!==JSON.stringify({...plan,...actual,verdict:'EXACT_SHARD_COMPLETE',classification:'UNIT_SHARD_ONLY_NOT_FOUNDATION_OR_SOURCE_ADMISSION'}))throw Error('Revalidated native evidence required');if(report.index!==i+1||report.count!==8||report.verdict!=='EXACT_SHARD_COMPLETE'||JSON.stringify(report.binding)!==JSON.stringify(binding()))throw Error('Exact native shard binding required');return report;});
           for(const report of reports)if(JSON.stringify(report.full)!==JSON.stringify(reports[0].full))throw Error('Same complete original collection required');
           requireUnion(reports.map(r=>r.selected),reports[0].full);
           requireUnion(reports.map(r=>r.ids),reports.flatMap(r=>r.ids));
           if(process.env.UNIT_JOB_RESULT!=='success')throw Error('Every native shard job must succeed');
           writeFileSync(resolve(out,'combined.json'),JSON.stringify({classification:'COMPLETE_FIXED568_UNIT_SUPPLEMENT_NOT_FOUNDATION_ACCEPTANCE',target:binding(),files:reports[0].full.length,shards:8,passed:reports.reduce((n,r)=>n+r.passed,0),declaredSkipped:reports.reduce((n,r)=>n+r.declared_skipped,0),wholeFoundationPass:false,sourceAdmission:false},null,2));
          }else throw Error('Exact validation stage required');
          PROBE
          node --check "$DIAGNOSTIC_DIR/validate.mjs"
          cat > "$DIAGNOSTIC_DIR/observer.mjs" <<'CPU_OBSERVER'
          import {
            constants,
            openSync,
            closeSync,
            readSync,
            writeSync,
            fsyncSync,
            fstatSync,
            lstatSync,
            realpathSync,
            opendirSync,
          } from 'node:fs';
          import { isAbsolute, join, relative, resolve } from 'node:path';
          import { performance } from 'node:perf_hooks';

          const PROC_ROOT = '/proc';
          const MAX_PID = 2147483647;
          const MAX_READ = 65536;
          const MAX_PROCESSES = 128;
          const MAX_THREADS = 128;
          const MAX_SAMPLES = 2701;
          const MAX_DURATION_MS = 45 * 60 * 1000;
          const MAX_OUTPUT = 16 * 1024 * 1024;
          const FINAL_RESERVE = 1024;
          const OUTPUT_NAME = 'foundation568-process-cpu.jsonl';
          const SIGNED_FIELDS = new Set([5, 6, 7, 8, 16, 17, 18, 19, 24, 38, 39, 44, 52]);

          function fault(code) {
            const error = new Error(code);
            error.code = code;
            return error;
          }

          function inputText(value, code) {
            if (typeof value !== 'string' && !Buffer.isBuffer(value)) throw fault(code);
            const size = Buffer.isBuffer(value) ? value.length : Buffer.byteLength(value);
            if (size > MAX_READ) throw fault('READ_LIMIT');
            const text = Buffer.isBuffer(value) ? value.toString('latin1') : value;
            if (text.includes('\0') || text.includes('\r')) throw fault(code);
            return text;
          }

          function unsigned(text, maximum, code, minimum = 0) {
            if (!/^(0|[1-9][0-9]*)$/.test(text) || text.length > 20) throw fault(code);
            const value = Number(text);
            if (!Number.isSafeInteger(value) || value < minimum || value > maximum)
              throw fault(code);
            return value;
          }

          export function parsePidArgument(value) {
            if (typeof value !== 'string') throw fault('PID_INVALID');
            return unsigned(value, MAX_PID, 'PID_INVALID', 1);
          }

          // The stat comm field may contain spaces and parentheses. It is discarded,
          // never returned. Unselected uint64 fields remain strings (e.g. RLIM_INFINITY).
          export function parseStat(value, expectedPid, expectedStartTicks) {
            const text = inputText(value, 'STAT_INVALID');
            if (
              !Number.isSafeInteger(expectedPid) ||
              expectedPid < 1 ||
              expectedPid > MAX_PID
            )
              throw fault('STAT_INVALID');
            const first = /^([1-9][0-9]*) \(/.exec(text);
            const end = text.lastIndexOf(') ');
            if (!first || end < first[0].length || !text.endsWith('\n'))
              throw fault('STAT_INVALID');
            const pid = unsigned(first[1], MAX_PID, 'STAT_INVALID', 1);
            if (pid !== expectedPid) throw fault('PID_IDENTITY_CHANGED');
            const fields = text.slice(end + 2, -1).split(' ');
            if (fields.length !== 50 || !/^[RSDZTWtXxKPI]$/.test(fields[0]))
              throw fault('STAT_INVALID');
            for (let index = 1; index < fields.length; index++) {
              const field = index + 3;
              const token = fields[index];
              if (!/^(0|-?[1-9][0-9]*)$/.test(token) || token.length > 20)
                throw fault('STAT_INVALID');
              const number = BigInt(token);
              const signed = SIGNED_FIELDS.has(field);
              if (
                number < (signed ? -(1n << 63n) : 0n) ||
                number > (signed ? (1n << 63n) - 1n : (1n << 64n) - 1n)
              )
                throw fault('STAT_INVALID');
            }
            const at = (field) =>
              unsigned(fields[field - 3], Number.MAX_SAFE_INTEGER, 'STAT_INVALID');
            const ppid = unsigned(fields[1], MAX_PID, 'STAT_INVALID');
            const exited = fields[0] === 'Z' || fields[0] === 'X' || fields[0] === 'x';
            const threadCount = unsigned(
              fields[17],
              MAX_THREADS,
              'THREAD_LIMIT',
              exited ? 0 : 1,
            );
            const startTicks = at(22);
            if (expectedStartTicks !== undefined) {
              if (!Number.isSafeInteger(expectedStartTicks) || expectedStartTicks < 0)
                throw fault('STAT_INVALID');
              if (startTicks !== expectedStartTicks) throw fault('PID_IDENTITY_CHANGED');
            }
            return Object.freeze({
              pid,
              ppid,
              startTicks,
              userTicks: at(14),
              systemTicks: at(15),
              reapedChildUserTicks: at(16),
              reapedChildSystemTicks: at(17),
              threadCount,
              exited,
            });
          }

          export function parseStatus(value, expectedPid) {
            const text = inputText(value, 'STATUS_INVALID');
            if (
              !Number.isSafeInteger(expectedPid) ||
              expectedPid < 1 ||
              expectedPid > MAX_PID
            )
              throw fault('STATUS_INVALID');
            if (!text.endsWith('\n')) throw fault('STATUS_INVALID');
            const selected = new Map();
            const wanted = new Set([
              'Tgid',
              'Pid',
              'PPid',
              'Threads',
              'voluntary_ctxt_switches',
              'nonvoluntary_ctxt_switches',
            ]);
            for (const line of text.slice(0, -1).split('\n')) {
              const match = /^([A-Za-z][A-Za-z0-9_]*):[ \t]*(.*)$/.exec(line);
              if (!match) throw fault('STATUS_INVALID');
              if (!wanted.has(match[1])) continue;
              if (selected.has(match[1])) throw fault('STATUS_INVALID');
              selected.set(match[1], match[2]);
            }
            if (selected.size !== wanted.size) throw fault('STATUS_INVALID');
            const get = (key, maximum = Number.MAX_SAFE_INTEGER, minimum = 0) =>
              unsigned(selected.get(key), maximum, 'STATUS_INVALID', minimum);
            if (
              get('Pid', MAX_PID, 1) !== expectedPid ||
              get('Tgid', MAX_PID, 1) !== expectedPid
            )
              throw fault('PID_IDENTITY_CHANGED');
            const threads = get('Threads', MAX_PID, 1);
            if (threads > MAX_THREADS) throw fault('THREAD_LIMIT');
            return Object.freeze({
              pid: expectedPid,
              ppid: get('PPid', MAX_PID),
              threadCount: threads,
              voluntarySwitches: get('voluntary_ctxt_switches'),
              involuntarySwitches: get('nonvoluntary_ctxt_switches'),
            });
          }

          export function parseChildren(value) {
            const text = inputText(value, 'CHILDREN_INVALID');
            if (!/^[0-9 \t\n]*$/.test(text)) throw fault('CHILDREN_INVALID');
            const stripped = text.trim();
            if (!stripped) return Object.freeze([]);
            const tokens = stripped.split(/[ \t\n]+/);
            if (tokens.length > MAX_PROCESSES) throw fault('PROCESS_LIMIT');
            const ids = tokens.map((token) =>
              unsigned(token, MAX_PID, 'CHILDREN_INVALID', 1),
            );
            if (new Set(ids).size !== ids.length) throw fault('CHILDREN_INVALID');
            return Object.freeze(ids);
          }

          export function assertCounterProgress(previous, current) {
            if (previous === undefined) return;
            if (
              previous.pid !== current.pid ||
              previous.startTicks !== current.startTicks
            )
              throw fault('PID_IDENTITY_CHANGED');
            for (const key of [
              'userTicks',
              'systemTicks',
              'reapedChildUserTicks',
              'reapedChildSystemTicks',
              'voluntarySwitches',
              'involuntarySwitches',
            ]) {
              if (
                !Number.isSafeInteger(previous[key]) ||
                previous[key] < 0 ||
                !Number.isSafeInteger(current[key]) ||
                current[key] < 0
              )
                throw fault('COUNTER_INVALID');
              if (current[key] < previous[key]) throw fault('COUNTER_REGRESSION');
            }
          }

          function gone(error) {
            return error?.code === 'ENOENT' || error?.code === 'ESRCH';
          }

          function readBounded(path, budget) {
            budget();
            const fd = openSync(path, constants.O_RDONLY | constants.O_NOFOLLOW);
            try {
              const bytes = Buffer.alloc(MAX_READ);
              let size = 0;
              while (size < MAX_READ) {
                budget();
                const count = readSync(fd, bytes, size, MAX_READ - size, null);
                if (count === 0) return bytes.subarray(0, size);
                size += count;
              }
              // One-byte overrun probe; every read syscall is at most64KiB.
              const extra = Buffer.alloc(1);
              if (readSync(fd, extra, 0, 1, null) !== 0) throw fault('READ_LIMIT');
              return bytes;
            } finally {
              closeSync(fd);
            }
          }

          function statFor(pid, startTicks, budget) {
            return parseStat(
              readBounded(`${PROC_ROOT}/${pid}/stat`, budget),
              pid,
              startTicks,
            );
          }

          function threadIds(pid, budget) {
            budget();
            const directory = opendirSync(`${PROC_ROOT}/${pid}/task`);
            const ids = [];
            try {
              let entry;
              while ((entry = directory.readSync()) !== null) {
                budget();
                if (ids.length === MAX_THREADS) throw fault('THREAD_LIMIT');
                if (!entry.isDirectory()) throw fault('PROC_SHAPE_INVALID');
                ids.push(parsePidArgument(entry.name));
              }
            } finally {
              directory.closeSync();
            }
            return ids;
          }

          function captureTree(rootPid, rootStart, previous, budget) {
            const queue = [{ pid: rootPid, startTicks: rootStart }];
            const queued = new Set([rootPid]);
            for (const row of previous.values()) {
              if (row.pid === rootPid) continue;
              queue.push({ pid: row.pid, startTicks: row.startTicks });
              queued.add(row.pid);
            }
            const rows = new Map();
            let partial = false;
            for (let cursor = 0; cursor < queue.length; cursor++) {
              budget();
              const item = queue[cursor];
              let first, status, last;
              const children = new Set();
              try {
                first = statFor(item.pid, item.startTicks, budget);
                if (first.exited) {
                  if (item.pid === rootPid) throw fault('ROOT_GONE');
                  partial = true;
                  continue;
                }
                if (
                  item.parent !== undefined &&
                  (first.ppid !== item.parent || first.startTicks < item.parentStart)
                ) {
                  partial = true;
                  continue;
                }
                status = parseStatus(
                  readBounded(`${PROC_ROOT}/${item.pid}/status`, budget),
                  item.pid,
                );
                for (const tid of threadIds(item.pid, budget)) {
                  try {
                    for (const child of parseChildren(
                      readBounded(
                        `${PROC_ROOT}/${item.pid}/task/${tid}/children`,
                        budget,
                      ),
                    )) {
                      if (!children.has(child) && children.size === MAX_PROCESSES)
                        throw fault('PROCESS_LIMIT');
                      children.add(child);
                    }
                  } catch (error) {
                    if (!gone(error)) throw error;
                    partial = true;
                  }
                }
                last = statFor(item.pid, first.startTicks, budget);
                if (last.exited) {
                  if (item.pid === rootPid) throw fault('ROOT_GONE');
                  partial = true;
                  continue;
                }
              } catch (error) {
                if (error.code === 'PID_IDENTITY_CHANGED')
                  throw fault(
                    item.pid === rootPid
                      ? 'ROOT_IDENTITY_CHANGED'
                      : 'DESCENDANT_IDENTITY_CHANGED',
                  );
                if (gone(error) || error.code === 'ROOT_GONE') {
                  if (item.pid === rootPid) throw fault('ROOT_GONE');
                  partial = true;
                  continue;
                }
                throw error;
              }
              if (status.ppid !== last.ppid) {
                partial = true;
                if (item.pid === rootPid) throw fault('ROOT_SAMPLE_RACE');
                continue;
              }
              const row = Object.freeze({
                pid: last.pid,
                ppid: last.ppid,
                startTicks: last.startTicks,
                userTicks: last.userTicks,
                systemTicks: last.systemTicks,
                reapedChildUserTicks: last.reapedChildUserTicks,
                reapedChildSystemTicks: last.reapedChildSystemTicks,
                voluntarySwitches: status.voluntarySwitches,
                involuntarySwitches: status.involuntarySwitches,
              });
              assertCounterProgress(previous.get(item.pid), row);
              rows.set(item.pid, row);
              for (const child of children) {
                if (child === item.pid || child === rootPid)
                  throw fault('PROC_SHAPE_INVALID');
                if (child === process.pid) throw fault('OBSERVER_IN_TREE');
                if (queued.has(child)) continue;
                if (queue.length === MAX_PROCESSES) throw fault('PROCESS_LIMIT');
                const old = previous.get(child);
                queue.push({
                  pid: child,
                  startTicks: old?.startTicks,
                  parent: item.pid,
                  parentStart: first.startTicks,
                });
                queued.add(child);
              }
            }
            try {
              if (statFor(rootPid, rootStart, budget).exited) throw fault('ROOT_GONE');
            } catch (error) {
              if (gone(error)) throw fault('ROOT_GONE');
              if (error.code === 'PID_IDENTITY_CHANGED')
                throw fault('ROOT_IDENTITY_CHANGED');
              throw error;
            }
            return { rows, partial };
          }

          function canonicalDirectory(path) {
            if (
              typeof path !== 'string' ||
              !isAbsolute(path) ||
              resolve(path) !== path ||
              realpathSync(path) !== path
            )
              throw fault('OUTPUT_CONFIG_INVALID');
            const info = lstatSync(path);
            if (!info.isDirectory() || info.isSymbolicLink())
              throw fault('OUTPUT_CONFIG_INVALID');
            return info;
          }

          function inside(parent, child) {
            const rel = relative(parent, child);
            return (
              rel !== '' && rel !== '..' && !rel.startsWith('../') && !isAbsolute(rel)
            );
          }

          function outputFile() {
            const temporary = process.env.RUNNER_TEMP;
            const directory = process.env.DIAGNOSTIC_DIR;
            const cwd = resolve(process.cwd());
            const captured = new Map([
              [temporary, canonicalDirectory(temporary)],
              [directory, canonicalDirectory(directory)],
              [cwd, canonicalDirectory(cwd)],
            ]);
            if (
              !inside(temporary, directory) ||
              directory === cwd ||
              inside(cwd, directory) ||
              inside(directory, cwd)
            )
              throw fault('OUTPUT_CONFIG_INVALID');
            const path = join(directory, OUTPUT_NAME);
            const fd = openSync(
              path,
              constants.O_WRONLY |
                constants.O_CREAT |
                constants.O_EXCL |
                constants.O_NOFOLLOW,
              0o600,
            );
            let bytesWritten = 0;
            const check = () => {
              if (process.cwd() !== cwd) throw fault('OUTPUT_CHANGED');
              for (const [name, before] of captured) {
                const now = canonicalDirectory(name);
                if (
                  now.dev !== before.dev ||
                  now.ino !== before.ino ||
                  now.mode !== before.mode
                )
                  throw fault('OUTPUT_CHANGED');
              }
              const file = fstatSync(fd),
                current = lstatSync(path);
              if (
                !file.isFile() ||
                current.isSymbolicLink() ||
                current.dev !== file.dev ||
                current.ino !== file.ino ||
                file.nlink !== 1 ||
                (file.mode & 0o7777) !== 0o600 ||
                file.size !== bytesWritten
              )
                throw fault('OUTPUT_CHANGED');
            };
            return {
              write(record, final = false) {
                check();
                const bytes = Buffer.from(JSON.stringify(record) + '\n');
                if (
                  bytesWritten + bytes.length >
                  MAX_OUTPUT - (final ? 0 : FINAL_RESERVE)
                )
                  throw fault('OUTPUT_LIMIT');
                let offset = 0;
                while (offset < bytes.length) {
                  const count = writeSync(fd, bytes, offset, bytes.length - offset);
                  if (count === 0) throw fault('OUTPUT_FAILED');
                  bytesWritten += count;
                  offset += count;
                }
              },
              close() {
                try {
                  fsyncSync(fd);
                } finally {
                  closeSync(fd);
                }
              },
            };
          }

          const FIXED_FAILURES = new Set([
            'READ_LIMIT',
            'STAT_INVALID',
            'STATUS_INVALID',
            'CHILDREN_INVALID',
            'PID_INVALID',
            'PID_IDENTITY_CHANGED',
            'ROOT_IDENTITY_CHANGED',
            'DESCENDANT_IDENTITY_CHANGED',
            'PROCESS_LIMIT',
            'THREAD_LIMIT',
            'PROC_SHAPE_INVALID',
            'ROOT_SAMPLE_RACE',
            'DURATION_LIMIT',
            'CLOCK_INVALID',
            'OUTPUT_CONFIG_INVALID',
            'OUTPUT_CHANGED',
            'OUTPUT_LIMIT',
            'OUTPUT_FAILED',
            'OBSERVER_IN_TREE',
            'COUNTER_INVALID',
            'COUNTER_REGRESSION',
          ]);

          async function observe() {
            if (
              process.platform !== 'linux' ||
              process.versions.node.split('.')[0] !== '24'
            )
              return 1;
            if (process.argv.length !== 3) return 1;
            let output;
            let exitCode = 1,
              status = 'OBSERVER_FAILED',
              samples = 0;
            let cancelled, wake;
            const onTerm = () => {
              cancelled = 'CANCELLED_SIGTERM';
              wake?.();
            };
            const onInt = () => {
              cancelled = 'CANCELLED_SIGINT';
              wake?.();
            };
            try {
              const rootPid = parsePidArgument(process.argv[2]);
              if (rootPid === process.pid) throw fault('PID_INVALID');
              output = outputFile();
              process.on('SIGTERM', onTerm);
              process.on('SIGINT', onInt);
              const started = performance.now(),
                startedUtc = Date.now();
              const budget = () => {
                const elapsed = performance.now() - started;
                if (!Number.isFinite(elapsed) || elapsed < 0)
                  throw fault('CLOCK_INVALID');
                if (
                  elapsed >= MAX_DURATION_MS ||
                  Date.now() - startedUtc >= MAX_DURATION_MS
                )
                  throw fault('DURATION_LIMIT');
              };
              let initial;
              try {
                initial = statFor(rootPid, undefined, budget);
              } catch (error) {
                if (gone(error)) throw fault('ROOT_GONE');
                throw error;
              }
              if (initial.exited) throw fault('ROOT_GONE');
              let previous = new Map();
              while (samples < MAX_SAMPLES) {
                if (cancelled) {
                  status = cancelled;
                  break;
                }
                budget();
                const sampleStarted = performance.now();
                const sampleUtc = new Date().toISOString();
                const captured = captureTree(
                  rootPid,
                  initial.startTicks,
                  previous,
                  budget,
                );
                output.write({
                  status: captured.partial ? 'PARTIAL_SAMPLE' : 'SAMPLE',
                  monotonicMs: sampleStarted,
                  utc: sampleUtc,
                  processes: [...captured.rows.values()].sort((a, b) => a.pid - b.pid),
                });
                previous = captured.rows;
                samples++;
                if (samples === MAX_SAMPLES) {
                  status = 'SAMPLE_LIMIT';
                  break;
                }
                await new Promise((done) => {
                  const timer = setTimeout(
                    done,
                    Math.max(0, sampleStarted + 1000 - performance.now()),
                  );
                  wake = () => {
                    clearTimeout(timer);
                    done();
                  };
                  if (cancelled) wake();
                });
                wake = undefined;
              }
            } catch (error) {
              if (error.code === 'ROOT_GONE') {
                status = samples === 0 ? 'ROOT_MISSING_FIRST_SAMPLE' : 'ROOT_EXITED';
                exitCode = samples === 0 ? 1 : 0;
              } else
                status = FIXED_FAILURES.has(error.code) ? error.code : 'PROC_READ_FAILED';
            } finally {
              process.removeListener('SIGTERM', onTerm);
              process.removeListener('SIGINT', onInt);
              if (cancelled) {
                status = cancelled;
                exitCode = cancelled === 'CANCELLED_SIGTERM' ? 143 : 130;
              }
              if (output) {
                try {
                  output.write(
                    {
                      status,
                      monotonicMs: performance.now(),
                      utc: new Date().toISOString(),
                    },
                    true,
                  );
                } catch {
                  exitCode = 1;
                }
                try {
                  output.close();
                } catch {
                  exitCode = 1;
                }
              }
            }
            return exitCode;
          }

          // Node24.2+ main detection also handles a CLI symlink without reading source.
          // Older runtimes must not silently succeed without starting observation.
          if (typeof import.meta.main !== 'boolean') process.exitCode = 1;
          else if (import.meta.main) {
            try {
              process.exitCode = await observe();
            } catch {
              process.exitCode = 1;
            }
          }
          CPU_OBSERVER
          node --check "$DIAGNOSTIC_DIR/observer.mjs"
      - name: Require unchanged fixed source before collection
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}
        run: node "$DIAGNOSTIC_DIR/source.mjs" before
      - name: Reuse original native eight-shard planner and complete file union
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}
        run: node "$DIAGNOSTIC_DIR/plan.mjs"
      - name: Run original complete native unit shard without budget or worker overrides
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/8 \
            --reporter=default --reporter=json --reporter="$DIAGNOSTIC_DIR/reporter.mjs" \
            --outputFile.json="$DIAGNOSTIC_DIR/results.json" &
          unit_pid=$!
          node "$DIAGNOSTIC_DIR/observer.mjs" "$unit_pid" &
          cpu_pid=$!
          unit_status=0
          wait "$unit_pid" || unit_status=$?
          cpu_status=0
          wait "$cpu_pid" || cpu_status=$?
          if [ "$unit_status" -ne 0 ]; then
            exit "$unit_status"
          fi
          exit "$cpu_status"
      - name: Verify source bodies and modes after tests without deleting fixture outputs
        if: always()
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}
        run: node "$DIAGNOSTIC_DIR/source.mjs" after
      - name: Reuse unchanged native collection case status and budget validation
        if: always()
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}
        run: node "$DIAGNOSTIC_DIR/validate.mjs" shard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixed568-unit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/fixed568-unit-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7
  complete-unit-union:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-fixed568-unit-supplement')
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f0c6b53747e60765cdc7faf1308b57ce730676f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fixed568-unit-shard-*
          path: ${{ runner.temp }}/fixed568-unit-union/downloaded
          merge-multiple: false
      - name: Revalidate every original shard and exact complete unit union
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/fixed568-unit-union
          UNIT_JOB_RESULT: ${{ needs.application.result }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$DIAGNOSTIC_DIR/validate.mjs" <<'PROBE'
          import {readFileSync,writeFileSync,readdirSync,realpathSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const out=process.env.DIAGNOSTIC_DIR;
          if(!out||!process.env.RUNNER_TEMP||!realpathSync(out).startsWith(realpathSync(process.env.RUNNER_TEMP)+'/')||realpathSync(out)===realpathSync(process.cwd())||realpathSync(out).startsWith(realpathSync(process.cwd())+'/'))throw Error('Outside-checkout validation output required');
          const {validateApplication,requireUnion,binding}=await import(pathToFileURL(resolve('scripts/cycle33-foundation-evidence.mjs')).href);
          const json=path=>JSON.parse(readFileSync(path));
          if(process.argv[2]==='shard'){
           const plan=json(resolve(out,'plan.json')),observed=json(resolve(out,'observations.json')),raw=json(resolve(out,'results.json'));
           const result=validateApplication(plan,observed,raw);
           writeFileSync(resolve(out,'verified.json'),JSON.stringify({...plan,...result,verdict:'EXACT_SHARD_COMPLETE',classification:'UNIT_SHARD_ONLY_NOT_FOUNDATION_OR_SOURCE_ADMISSION'},null,2));
          }else if(process.argv[2]==='combine'){
           const paths=readdirSync(resolve(out,'downloaded')).sort(),expected=Array.from({length:8},(_,i)=>'fixed568-unit-shard-'+(i+1));
           requireUnion([paths],expected);
           const reports=expected.map((p,i)=>{const directory=resolve(out,'downloaded',p),report=json(resolve(directory,'verified.json'));const plan=json(resolve(directory,'plan.json'));const actual=validateApplication(plan,json(resolve(directory,'observations.json')),json(resolve(directory,'results.json')));if(JSON.stringify(report)!==JSON.stringify({...plan,...actual,verdict:'EXACT_SHARD_COMPLETE',classification:'UNIT_SHARD_ONLY_NOT_FOUNDATION_OR_SOURCE_ADMISSION'}))throw Error('Revalidated native evidence required');if(report.index!==i+1||report.count!==8||report.verdict!=='EXACT_SHARD_COMPLETE'||JSON.stringify(report.binding)!==JSON.stringify(binding()))throw Error('Exact native shard binding required');return report;});
           for(const report of reports)if(JSON.stringify(report.full)!==JSON.stringify(reports[0].full))throw Error('Same complete original collection required');
           requireUnion(reports.map(r=>r.selected),reports[0].full);
           requireUnion(reports.map(r=>r.ids),reports.flatMap(r=>r.ids));
           if(process.env.UNIT_JOB_RESULT!=='success')throw Error('Every native shard job must succeed');
           writeFileSync(resolve(out,'combined.json'),JSON.stringify({classification:'COMPLETE_FIXED568_UNIT_SUPPLEMENT_NOT_FOUNDATION_ACCEPTANCE',target:binding(),files:reports[0].full.length,shards:8,passed:reports.reduce((n,r)=>n+r.passed,0),declaredSkipped:reports.reduce((n,r)=>n+r.declared_skipped,0),wholeFoundationPass:false,sourceAdmission:false},null,2));
          }else throw Error('Exact validation stage required');
          PROBE
          node "$DIAGNOSTIC_DIR/validate.mjs" combine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixed568-complete-unit-union
          path: ${{ runner.temp }}/fixed568-unit-union/
          if-no-files-found: error
          retention-days: 7
